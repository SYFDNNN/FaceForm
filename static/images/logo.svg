<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7C7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="faceGrad2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Face outline - side/front geometric -->
  <!-- Head shape -->
  <path d="M16 3 C10 3 7 7 7 13 L7 19 C7 24 11 29 16 29 C21 29 25 24 25 19 L25 13 C25 7 22 3 16 3Z"
        stroke="url(#faceGrad)" stroke-width="1.2" fill="none" opacity="0.9"/>

  <!-- Mesh lines horizontal -->
  <line x1="9"  y1="12" x2="23" y2="12" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>
  <line x1="8"  y1="17" x2="24" y2="17" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>
  <line x1="9"  y1="22" x2="23" y2="22" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>

  <!-- Mesh lines vertical -->
  <line x1="12" y1="4"  x2="10" y2="27" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>
  <line x1="16" y1="3"  x2="16" y2="29" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>
  <line x1="20" y1="4"  x2="22" y2="27" stroke="url(#faceGrad)" stroke-width="0.6" opacity="0.5"/>

  <!-- Polygon nodes (intersection dots) -->
  <circle cx="12" cy="12" r="1"   fill="url(#faceGrad)"/>
  <circle cx="16" cy="12" r="1"   fill="url(#faceGrad)"/>
  <circle cx="20" cy="12" r="1"   fill="url(#faceGrad)"/>
  <circle cx="11" cy="17" r="1"   fill="url(#faceGrad)"/>
  <circle cx="16" cy="17" r="1.2" fill="url(#faceGrad)"/>
  <circle cx="21" cy="17" r="1"   fill="url(#faceGrad)"/>
  <circle cx="12" cy="22" r="1"   fill="url(#faceGrad)"/>
  <circle cx="16" cy="22" r="1"   fill="url(#faceGrad)"/>
  <circle cx="20" cy="22" r="1"   fill="url(#faceGrad)"/>

  <!-- Top center node (crown) -->
  <circle cx="16" cy="3"  r="1.2" fill="#6EE7C7"/>
  <!-- Chin node -->
  <circle cx="16" cy="29" r="1"   fill="#3B82F6"/>

  <!-- Eyes highlight -->
  <circle cx="13" cy="14" r="1.3" fill="url(#faceGrad)" opacity="0.9"/>
  <circle cx="19" cy="14" r="1.3" fill="url(#faceGrad)" opacity="0.9"/>

  <!-- Diagonal mesh triangles -->
  <line x1="12" y1="12" x2="16" y2="17" stroke="url(#faceGrad)" stroke-width="0.5" opacity="0.4"/>
  <line x1="20" y1="12" x2="16" y2="17" stroke="url(#faceGrad)" stroke-width="0.5" opacity="0.4"/>
  <line x1="11" y1="17" x2="12" y2="22" stroke="url(#faceGrad)" stroke-width="0.5" opacity="0.4"/>
  <line x1="21" y1="17" x2="20" y2="22" stroke="url(#faceGrad)" stroke-width="0.5" opacity="0.4"/>
</svg>
