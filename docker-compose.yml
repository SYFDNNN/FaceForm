version: "3.9"

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  model_data:
  redis_data:

# ─── Services ─────────────────────────────────────────────────────────────────
services:

  # ── Flask App (Gunicorn) ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: face_shape_app
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      # ⚠️  CHANGE THESE VALUES — never commit real keys to git
      API_KEY_LIST: ${API_KEY_LIST:-dev-key-change-me}
      MODEL_PATH: /app/model/face_shape_model.pth
      MAX_CONTENT_LENGTH: "8388608"   # 8MB
      RATE_LIMIT: "60 per minute"
      WORKERS: "4"
      THREADS: "2"
      TIMEOUT: "120"
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Mount model file from host (place face_shape_model.pth in ./model/)
      - ./model:/app/model:ro
      # Optional: persist logs
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - app_net
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: face_shape_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment for HTTPS (requires SSL cert volumes):
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL certs — set SSL_CERT_PATH and SSL_KEY_PATH env vars, then:
      # - ${SSL_CERT_PATH:-./certs/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      # - ${SSL_KEY_PATH:-./certs/key.pem}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      - app
    networks:
      - app_net

  # ── Redis (rate limiter storage) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: face_shape_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app_net
    expose:
      - "6379"
