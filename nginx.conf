# nginx.conf — Production reverse proxy configuration for Face Shape Classifier
# Place this file at ./nginx.conf (mounted into the nginx container)

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;  # hide nginx version

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    # Coarse limit at nginx layer (fine-grained control is in Flask/redis)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # ── Upstream Pool ─────────────────────────────────────────────────────────
    upstream flask_app {
        server app:5000;
        keepalive 32;
    }

    # ── HTTP Server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;    # catch-all; replace with your domain in production

        # Redirect HTTP → HTTPS in production:
        # return 301 https://$host$request_uri;

        client_max_body_size 10M;   # must be >= MAX_CONTENT_LENGTH in Flask
        client_body_timeout 30s;
        client_header_timeout 30s;

        # ── Security Headers ────────────────────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:;"
            always;

        # ── Static Files ────────────────────────────────────────────────────────
        location /static/ {
            proxy_pass http://flask_app;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── API Endpoints ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering — disable for streaming, enable for file uploads
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ── SPA / Frontend ──────────────────────────────────────────────────────
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health Check (bypass rate limit) ────────────────────────────────────
        location = /api/health {
            proxy_pass http://flask_app;
            access_log off;
        }
    }

    # ── HTTPS Server (uncomment and configure SSL certs) ──────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     ... (same location blocks as above)
    # }
}
